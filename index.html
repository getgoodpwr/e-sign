<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Goodpwr Solar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
:root{
  --bg:#f3f3f1;
  --panel:#fff;
  --soft:#f7f7f5;
  --ink:#25272a;
  --muted:#74777a;
  --line:#dedfdd;
  --dark:#303236;
  --accent:#666a70;
  --danger:#9a3f3f;
  --success:#456b4d;
  --shadow:0 10px 30px rgba(0,0,0,.07)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,
input,
select,
textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

.top{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 24px;
  gap:24px;
  position:sticky;
  top:0;
  z-index:30
}

.brand{
  font:600 22px Georgia,serif;
  letter-spacing:-.5px
}

.nav{
  display:flex;
  gap:4px;
  height:100%;
  align-items:center
}

.nav button{
  border:0;
  background:none;
  padding:10px 13px;
  color:var(--muted);
  border-radius:7px
}

.nav button.active,
.nav button:hover{
  background:#f0f0ee;
  color:var(--ink)
}

.spacer{
  flex:1
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#34373a;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px
}

.userbox{
  display:flex;
  align-items:center;
  gap:9px
}

.userbox small{
  display:block;
  color:var(--muted);
  font-size:11px
}

.shell{
  display:flex;
  min-height:calc(100vh - 64px)
}

.side{
  width:230px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 14px
}

.side h4{
  margin:0 10px 10px;
  color:#999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px
}

.side button{
  display:flex;
  width:100%;
  border:0;
  background:none;
  padding:10px 11px;
  border-radius:7px;
  text-align:left;
  color:#5d6063;
  margin-bottom:2px
}

.side button:hover,
.side button.active{
  background:#f0f0ee;
  color:#222
}

.side .count{
  margin-left:auto;
  color:#999
}

.main{
  flex:1;
  padding:30px 34px;
  min-width:0
}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px
}

.page-title h1{
  font:500 30px Georgia,serif;
  margin:0 0 5px
}

.sub{
  color:var(--muted)
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:#333;
  border-radius:7px;
  padding:9px 13px
}

.btn:hover{
  background:#f3f3f1
}

.btn.dark{
  background:#303236;
  border-color:#303236;
  color:#fff
}

.btn.ghost{
  background:transparent
}

.btn.danger{
  color:var(--danger)
}

.btn.success{
  color:var(--success)
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 7px rgba(0,0,0,.02)
}

.template-card{
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.template-name{
  font-weight:600
}

.meta{
  font-size:12px;
  color:var(--muted)
}

.card-actions{
  display:flex;
  gap:7px;
  align-items:center
}

.star{
  border:0;
  background:none;
  font-size:20px;
  color:#a7a9aa;
  padding:0
}

.star.on{
  color:#333
}

.empty{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #cfd0ce;
  border-radius:10px;
  background:rgba(255,255,255,.5)
}

.status-chip{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:20px;
  background:#f0f0ee;
  color:#555;
  font-size:11px
}

.status-chip.action{
  background:#f4ece7;
  color:#80563f
}

.status-chip.pending{
  background:#efefec;
  color:#626262
}

.status-chip.completed{
  background:#e9f0ea;
  color:#4e6853
}

/* editor */

.editor-top{
  height:60px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:8px
}

.editor-name{
  min-width:220px;
  font-weight:600
}

.editor-layout{
  display:grid;
  grid-template-columns:190px minmax(450px,1fr) 270px;
  height:calc(100vh - 124px);
  overflow:hidden
}

.toolbox,
.properties{
  background:#fff;
  overflow:auto
}

.toolbox{
  border-right:1px solid var(--line);
  padding:16px 12px
}

.properties{
  border-left:1px solid var(--line);
  padding:18px
}

.toolgroup{
  margin-bottom:18px
}

.toolgroup h5{
  margin:0 8px 8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#999
}

.field-tool{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:9px 10px;
  margin:3px 0;
  text-align:left;
  color:#444
}

.field-tool:hover{
  background:#f4f4f2
}

.canvas-wrap{
  overflow:auto;
  padding:30px;
  background:#e9e9e6
}

.doc-page{
  position:relative;
  margin:0 auto 25px;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.13);
  width:min(820px,90%)
}

.doc-page canvas{
  width:100%;
  height:auto;
  display:block
}

.overlay{
  position:absolute;
  inset:0
}

.field{
  position:absolute;
  border:1px solid #7b7e82;
  background:rgba(244,244,242,.88);
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  min-height:18px;
  user-select:none;
  touch-action:none
}

.field.selected{
  border:2px solid #36393c;
  background:rgba(232,232,228,.92);
  z-index:10
}

.field .tag{
  font-size:10px;
  color:#505256;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 4px
}

.field .delete{
  position:absolute;
  right:-8px;
  top:-8px;
  width:17px;
  height:17px;
  border-radius:50%;
  border:0;
  background:#303236;
  color:#fff;
  font-size:12px;
  line-height:17px;
  padding:0;
  display:none
}

.field.selected .delete{
  display:block
}

.resize{
  position:absolute;
  right:-5px;
  bottom:-5px;
  width:10px;
  height:10px;
  background:#303236;
  border-radius:2px;
  display:none;
  cursor:nwse-resize
}

.field.selected .resize{
  display:block
}

.field input,
.field select{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  outline:0;
  padding:3px;
  font-size:11px
}

.field input[type=checkbox]{
  width:18px;
  height:18px
}

.prop h3{
  font:500 20px Georgia,serif;
  margin:0 0 18px
}

.prop label{
  display:block;
  font-size:11px;
  color:#777;
  margin:12px 0 5px
}

.prop input,
.prop select,
.prop textarea{
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff
}

.prop-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

/* auth/sign */

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,20,20,.38);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100
}

.modal-card{
  background:#fff;
  width:min(470px,92vw);
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:25px;
  box-shadow:var(--shadow)
}

.modal-card h2{
  font:500 25px Georgia,serif;
  margin:0 0 7px
}

.modal-card input,
.modal-card select{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:7px;
  margin:6px 0 10px
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:14px
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#303236;
  color:#fff;
  padding:11px 15px;
  border-radius:7px;
  z-index:200;
  box-shadow:var(--shadow);
  max-width:420px
}

/* signing */

.sign-shell{
  max-width:1050px;
  margin:0 auto;
  padding:28px
}

.sign-head{
  background:#fff;
  border:1px solid var(--line);
  padding:16px 20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:18px
}

.sign-head h1{
  font:500 22px Georgia,serif;
  margin:0
}

.sign-doc{
  background:#e9e9e6;
  padding:25px
}

.sign-page{
  position:relative;
  margin:0 auto 20px;
  background:#fff;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
  max-width:820px
}

.sign-page canvas{
  width:100%;
  display:block
}

.sign-page .field{
  border:1px solid #aaa;
  background:#fafaf8
}

.sign-page .field.assigned{
  border:2px solid #3f4347;
  background:#f0f0ed
}

.sign-footer{
  display:flex;
  justify-content:flex-end;
  margin-top:18px
}

.notice{
  padding:11px 13px;
  background:#f5f5f2;
  border:1px solid var(--line);
  border-radius:7px;
  color:#5f6265
}

.processing-overlay{
  position:fixed;
  inset:0;
  background:rgba(243,243,241,.86);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500
}

.processing-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px 34px;
  text-align:center;
  box-shadow:var(--shadow);
  min-width:280px
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #ddd;
  border-top-color:#303236;
  border-radius:50%;
  animation:siSpin .8s linear infinite;
  margin:0 auto 14px
}

@keyframes siSpin{
  to{transform:rotate(360deg)}
}

.team-row{
  display:grid;
  grid-template-columns:1.2fr 1.5fr .7fr .7fr;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}

.team-row:last-child{
  border-bottom:0
}

.envelope-row{
  padding:15px 0;
  border-bottom:1px solid var(--line)
}

.envelope-row:last-child{
  border-bottom:0
}

.recipient-line{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:6px 0;
  font-size:12px
}

.debug{
  font-size:11px;
  color:#999;
  word-break:break-word
}

@media(max-width:950px){
  .editor-layout{
    grid-template-columns:150px minmax(400px,1fr)
  }

  .properties{
    display:none
  }

  .side{
    width:190px
  }

  .nav{
    display:none
  }

  .team-row{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:700px){
  .side{
    display:none
  }

  .main{
    padding:20px
  }

  .editor-layout{
    grid-template-columns:1fr
  }

  .toolbox{
    display:none
  }

  .editor-top{
    height:auto;
    min-height:60px;
    flex-wrap:wrap
  }

  .doc-page{
    width:96%
  }

  .sign-shell{
    padding:12px
  }

  .top{
    padding:0 13px
  }

  .team-row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const API =
  'https://script.google.com/macros/s/AKfycbxW499aNhUq5xCFyG9_4Fu4tl-X8Z6kWiUlMlLWooINI05sVguvZvAGA7E_YmCe6rKt5Q/exec';

const state = {
  token: localStorage.getItem('si_token') || '',
  user: JSON.parse(localStorage.getItem('si_user') || 'null'),
  view: 'dashboard',
  section: 'saved',
  templates: [],
  dashboard: null,
  pdf: null,
  fields: [],
  pages: [],
  renderedPages: null,
  selected: null,
  tool: null,
  editorTemplateId: null,
  editorName: '',
  recipients: [],
  signingMode: 'sequential',
  signToken: new URLSearchParams(location.search).get('token'),
  completedMode: new URLSearchParams(location.search).get('completed') === '1',
  signingBusy: false,
  sendBusy: false,
  signSession: null
};

const $ = function(selector) { return document.querySelector(selector); };
const $$ = function(selector) { return document.querySelectorAll(selector); };

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c];
  });
}

function toast(message) {
  const element = document.createElement('div');
  element.className = 'toast';
  element.textContent = message;
  $('#toastRoot').append(element);
  setTimeout(function() { element.remove(); }, 3000);
}

function initials(name) {
  return String(name || 'U').split(/\s+/).slice(0,2).map(function(x) { return x[0]; }).join('').toUpperCase();
}

function showProcessing(title, message) {
  let root = document.getElementById('processingRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'processingRoot';
    document.body.append(root);
  }
  root.innerHTML = `
    <div class="processing-overlay">
      <div class="processing-card">
        <div class="spinner"></div>
        <div style="font:500 20px Georgia,serif;margin-bottom:7px">${esc(title)}</div>
        <div class="sub" style="line-height:1.5">${esc(message)}</div>
      </div>
    </div>
  `;
}

function hideProcessing() {
  const root = document.getElementById('processingRoot');
  if (root) root.remove();
}

async function api(action, data = {}) {
  try {
    if (!API) throw new Error('API URL is empty.');
    const response = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: state.token || '', data })
    });

    const raw = await response.text();
    if (!response.ok) return { success:false, error:'HTTP_ERROR', message:'Backend returned HTTP ' + response.status + '.' };

    let result;
    try { result = JSON.parse(raw); } catch (parseError) {
      return { success:false, error:'INVALID_RESPONSE', message:'Invalid response from backend.' };
    }

    if (!result || typeof result !== 'object') {
      return { success:false, error:'INVALID_RESPONSE', message:'Empty response from backend.' };
    }

    if (!result.success && result.error === 'UNAUTHORIZED') logoutLocal();

    return result;
  } catch (error) {
    return { success:false, error:'NETWORK_ERROR', message:'Could not reach backend: ' + (error?.message || '') };
  }
}

function logoutLocal() {
  state.token = '';
  state.user = null;
  localStorage.removeItem('si_token');
  localStorage.removeItem('si_user');
  render();
}

function showLogin() {
  modal(`
    <h2>Sign In to Goodpwr Solar</h2>
    <div class="sub" style="margin-bottom:12px">Enter your details to access the portal.</div>
    <label>Full Name</label>
    <input id="mName" type="text" placeholder="John Doe">
    <label>Email Address</label>
    <input id="mEmail" type="email" placeholder="name@getgoodpwr.com">
    <div id="mErr" class="small" style="min-height:18px;color:var(--danger)"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" id="loginButton" onclick="doLogin()">Sign In</button>
    </div>
  `);
}

function modal(html) {
  $('#modalRoot').innerHTML = `
    <div class="modal" onclick="if(event.target===this)closeModal()">
      <div class="modal-card">${html}</div>
    </div>
  `;
}

function closeModal() { $('#modalRoot').innerHTML = ''; }

async function doLogin() {
  const button = $('#loginButton');
  if (button) { button.disabled = true; button.textContent = 'Signing in…'; }

  const name = $('#mName') ? $('#mName').value.trim() : '';
  const email = $('#mEmail') ? $('#mEmail').value.trim() : '';

  if (!email) {
    if ($('#mErr')) $('#mErr').textContent = 'Email is required.';
    if (button) { button.disabled = false; button.textContent = 'Sign In'; }
    return;
  }

  const result = await api('login', { name, email });
  if (!result.success) {
    if ($('#mErr')) $('#mErr').textContent = result.message || 'Unable to sign in.';
    if (button) { button.disabled = false; button.textContent = 'Sign In'; }
    return;
  }

  state.token = result.data.token;
  state.user = result.data;

  localStorage.setItem('si_token', state.token);
  localStorage.setItem('si_user', JSON.stringify(state.user));

  closeModal();
  state.view = 'dashboard';
  state.section = 'saved';
  render();
  toast('Welcome ' + state.user.name + '.');
}

async function doLogout() {
  if (state.token) await api('logout');
  logoutLocal();
}

function render() {
  if (state.signToken) {
    if (state.completedMode) renderCompletedDocument();
    else renderSigner();
    return;
  }

  if (!state.token) {
    renderLanding();
    return;
  }

  if (state.view === 'editor') {
    renderEditor();
    return;
  }

  renderApp();
}

function renderLanding() {
  $('#app').innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center">
      <div style="text-align:center;max-width:540px;padding:30px">
        <div class="brand" style="font-size:38px;margin-bottom:15px">Goodpwr Solar</div>
        <h1 style="font:500 34px Georgia,serif">Document & E-Signing Portal</h1>
        <p class="sub" style="line-height:1.7">
          Administrators (@getgoodpwr.com) can build and dispatch templates.
          Signers receive secure links to sign documents smoothly.
        </p>
        <button class="btn dark" onclick="showLogin()">Sign In</button>
      </div>
    </div>
  `;
}

function renderApp() {
  const user = state.user || {};
  const isAdmin = user.role === 'admin';

  $('#app').innerHTML = `
    <header class="top">
      <div class="brand">Goodpwr Solar</div>
      <nav class="nav"><button class="active">Workspace</button></nav>
      <div class="spacer"></div>
      <div class="userbox">
        <div class="avatar">${initials(user.name)}</div>
        <div>
          <b>${esc(user.name)}</b>
          <small>${esc(user.role)}</small>
        </div>
      </div>
      <button class="btn" onclick="doLogout()">Sign out</button>
    </header>

    <div class="shell">
      <aside class="side">
        <h4>Workspace</h4>
        ${sideBtn('saved','Saved')}
        ${sideBtn('created','Created by Me')}
        ${sideBtn('recent','Recently Used')}
        ${sideBtn('favorites','Favorites')}

        <h4 style="margin-top:25px">Signing</h4>
        ${sideBtn('action','Action Required')}
        ${sideBtn('pending','Pending')}
        ${sideBtn('completed','Completed')}

        <h4 style="margin-top:25px">Manage</h4>
        ${sideBtn('templates','Templates')}
        ${isAdmin ? sideBtn('team','Team') : ''}
      </aside>

      <main class="main" id="main"></main>
    </div>
  `;

  loadDashboard();
}

function sideBtn(key, label) {
  return `
    <button class="${state.section === key ? 'active' : ''}" onclick="state.section='${key}';loadDashboard()">
      ${esc(label)}
    </button>
  `;
}

async function loadDashboard() {
  const main = $('#main');
  if (!main) return;

  main.innerHTML = '<div class="sub">Loading workspace…</div>';
  const result = await api('listDashboard');

  if (!result.success) {
    main.innerHTML = `<div class="empty"><b>Unable to load workspace.</b><br>${esc(result.message)}</div>`;
    return;
  }

  state.dashboard = result.data || {};
  const user = state.user || {};
  const isAdmin = user.role === 'admin';

  if (state.section === 'team') { renderTeam(); return; }

  let list = [];
  let title = 'Saved';

  if (state.section === 'created') { list = state.dashboard.createdByMe || []; title = 'Created by Me'; }
  else if (state.section === 'recent') { list = state.dashboard.recentlyUsed || []; title = 'Recently Used'; }
  else if (state.section === 'favorites') { list = state.dashboard.favorites || []; title = 'Favorites'; }
  else if (state.section === 'templates') { list = state.dashboard.saved || []; title = 'Templates'; }
  else if (state.section === 'action') { renderEnvelopeSection('Action Required', state.dashboard.actionRequired || []); return; }

  render();

function fromB64(value) {
  const bytes = Uint8Array.from(atob(value), function(c) { return c.charCodeAt(0); });
  return bytes.buffer;
}

function toB64(buffer) {
  const bytes = new Uint8Array(buffer);
  let output = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    output += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(output);
}

async function loadEditorPdf(buffer) {
  state.pdf = buffer;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
  state.pages = [];
  state.renderedPages = [];

  const holder = document.createElement('div');
  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale:1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

    const pageElement = document.createElement('div');
    pageElement.className = 'doc-page';

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.dataset.page = pageNumber - 1;

    pageElement.append(canvas, overlay);
    state.pages.push({ ov: overlay, ratio: viewport.width / viewport.height });
    holder.append(pageElement);
  }
  state.renderedPages = Array.from(holder.children);
}

function selectTool(type) {

function placeField(event, overlay) {
  if (!state.tool || event.target !== overlay) return;

  const rect = overlay.getBoundingClientRect();
  const sizes = {
    signature:[.28,.07], initials:[.12,.05], text:[.25,.04], long_text:[.35,.09],
    number:[.16,.04], name:[.25,.04], email:[.28,.04], date:[.18,.04], checkbox:[.035,.035], dropdown:[.25,.04]
  };

  const size = sizes[state.tool] || [.2,.04];
  const w = size[0];
  const h = size[1];

  const x = Math.max(0, Math.min((event.clientX - rect.left) / rect.width, 1 - w));
  const y = Math.max(0, Math.min((event.clientY - rect.top) / rect.height, 1 - h));

  state.fields.push({
    id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
    type: state.tool,
    page: +overlay.dataset.page,
    x, y, w, h,
    required: state.tool !== 'checkbox',
    recipientRole: '1',
    value: state.tool === 'checkbox' ? false : '',
    properties: { options: ['Option 1', 'Option 2'] }
  });

  state.tool = null;
  renderFields();
}

function renderFields() {
  state.pages.forEach(function(page) {
    page.ov.innerHTML = '';
    page.ov.onclick = function(event) { placeField(event, page.ov); };
  });

  state.fields.forEach(function(field) {
    const element = document.createElement('div');
    element.className = 'field' + (state.selected === field.id ? ' selected' : '');
    element.style.cssText = `left:${field.x * 100}%;top:${field.y * 100}%;width:${field.w * 100}%;height:${field.h * 100}%`;

    element.onclick = function(event) {
      event.stopPropagation();
      state.selected = field.id;
      renderFields();
    };

    const deleteButton = document.createElement('button');
    deleteButton.className = 'delete';
    deleteButton.textContent = '×';
    deleteButton.onclick = function(event) {
      event.stopPropagation();
      state.fields = state.fields.filter(function(x) { return x.id !== field.id; });
      state.selected = null;
      renderFields();
    };
    element.append(deleteButton);

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = field.type === 'checkbox' ? '☐' : field.type.replace('_', ' ');
    element.append(tag);

    if (state.pages[field.page]) state.pages[field.page].ov.append(element);
  });

  renderProperties();
}

function getFrontendUrl() {
  const url = location.origin + location.pathname;
  if (!url || url === 'null' || !/^https?:\/\//i.test(url)) return '';
  return url.replace(/\/+$/, '');
}

async function createAndSend(templateId) {
  if (state.sendBusy) return;

  state.recipients = state.recipients.map(function(r, index) {
    return {
      name: $('#rn' + index) ? $('#rn' + index).value.trim() : '',
      email: $('#re' + index) ? $('#re' + index).value.trim() : ''
    };
  });

  if (state.recipients.some(function(r) { return !r.name || !r.email; })) {
    toast('Complete all signer fields.');
    return;
  }

  const signingUrl = getFrontendUrl();
  if (!signingUrl) { toast('Could not determine application URL.'); return; }

  state.sendBusy = true;
  showProcessing('Sending document…', 'Dispatching signing requests.');

  try {
    const mode = $('#sendMode') ? $('#sendMode').value : 'sequential';
    const created = await api('createEnvelope', {
      templateId, signingMode: mode, recipients: state.recipients
    });

    if (!created.success) {
      hideProcessing(); state.sendBusy = false; toast(created.message); return;
    }

    const sent = await api('sendEnvelope', { envelopeId: created.data.envelopeId, signingUrl });
    hideProcessing();
    state.sendBusy = false;

    if (!sent.success) { toast(sent.message); return; }

    closeModal();
    toast('Document sent successfully.');
    state.section = 'pending';
    loadDashboard();
  } catch(error) {
    hideProcessing(); state.sendBusy = false; toast('Error sending document.');
  }
}

async function renderSignPdf(data) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(fromB64(data.pdfBase64)) }).promise;
  const host = $('#signDoc');
  if (!host) return;

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale:1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

    const pageElement = document.createElement('div');
    pageElement.className = 'sign-page';

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    pageElement.append(canvas, overlay);
    host.append(pageElement);

    data.fields.filter(function(f) { return f.page === pageNumber - 1; }).forEach(function(field) {
      const element = document.createElement('div');
      const owned = !field.recipientRole || String(field.recipientRole) === String(data.recipient.sequence);
      element.className = 'field' + (owned ? ' assigned' : '');
      element.style.cssText = `left:${field.x * 100}%;top:${field.y * 100}%;width:${field.w * 100}%;height:${field.h * 100}%`;

      if (!owned) { element.style.pointerEvents = 'none'; return; }

      if (field.type === 'signature' || field.type === 'initials') {
        element.textContent = field.value ? 'Signed' : 'Click to sign';
        element.onclick = function() { signatureFor(field, element); };
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = field.value || '';
        input.oninput = function() { field.value = input.value; };
        element.append(input);
      }
      overlay.append(element);
    });
  }
}

let sigTarget = null;
let sigTargetElement = null;

function signatureFor(field, element) {
  sigTarget = field;
  sigTargetElement = element;
  modal(`
    <h2>Your signature</h2>
    <canvas id="sigPad" width="600" height="180" style="width:100%;border:1px dashed #aaa;border-radius:7px;touch-action:none"></canvas>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" onclick="applySignerSig()">Apply</button>
    </div>
  `);

  const canvas = $('#sigPad');
  const context = canvas.getContext('2d');
  let drawing = false;

  canvas.onpointerdown = function(e) {
    drawing = true; canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    context.beginPath();
    context.moveTo((e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height);
  };

  canvas.onpointermove = function(e) {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    context.lineWidth = 3; context.lineCap = 'round';
    context.lineTo((e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height);
    context.stroke();
  };

  canvas.onpointerup = function() { drawing = false; };
}

function applySignerSig() {
  const canvas = $('#sigPad');
  if (!canvas || !sigTarget) return;

  sigTarget.value = canvas.toDataURL('image/png');
  closeModal();
  if (sigTargetElement) {
    sigTargetElement.textContent = 'Signed';
    sigTargetElement.classList.add('assigned');
  }
}

async function submitSigner() {
  if (state.signingBusy || !state.signSession) return;
  const values = {};

  for (const field of state.signSession.fields) {
    const owned = !field.recipientRole || String(field.recipientRole) === String(state.signSession.recipient.sequence);
    if (!owned) continue;
    if (field.required && (!field.value || String(field.value) === '')) {
      toast('Please complete all required fields.'); return;
    }
    values[field.id] = field.value;
  }

  state.signingBusy = true;
  showProcessing('Processing signature…', 'Saving signed document.');

  try {
    const finalPdfBase64 = await buildCompletedPdf();
    const result = await api('submitSigning', {
      token: state.signToken, values, pdfBase64: finalPdfBase64, signingUrl: getFrontendUrl()
    });

    hideProcessing();
    if (!result.success) { state.signingBusy = false; toast(result.message); return; }

    $('#app').innerHTML = `
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:12px">Goodpwr Solar</div>
          <h2>Thank you!</h2>
          <div>Your signature step is complete.</div>
        </div>
      </div>
    `;
  } catch(error) {
    hideProcessing(); state.signingBusy = false; toast('Error submitting signature.');
  }
}

async function buildCompletedPdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.load(fromB64(state.signSession.pdfBase64));
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const currentSequence = String(state.signSession.recipient.sequence);
  const pages = pdfDoc.getPages();

  for (const field of state.signSession.fields) {
    const owned = !field.recipientRole || String(field.recipientRole) === currentSequence;
    if (!owned || !field.value) continue;

    const page = pages[Number(field.page) || 0];
    const pageWidth = page.getWidth();
    const pageHeight = page.getHeight();

    const x = field.x * pageWidth;
    const y = pageHeight - ((field.y + field.h) * pageHeight);
    const w = field.w * pageWidth;
    const h = field.h * pageHeight;

    if (field.type === 'signature' || field.type === 'initials') {
      if (String(field.value).startsWith('data:image/')) {
        const raw = String(field.value).split(',')[1];
        const bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
        const image = await pdfDoc.embedPng(bytes);
        page.drawImage(image, { x, y, width: w, height: h });
      }
    } else {
      page.drawText(String(field.value), { x: x + 2, y: y + 2, size: 10, font, color: rgb(0.15, 0.15, 0.15) });
    }
  }

  return toB64(await pdfDoc.save());
}

async function renderCompletedDocument() {
  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="empty">
        <div class="brand" style="margin-bottom:12px">Goodpwr Solar</div>
        <h2>Completed Document Ready</h2>
        <button class="btn dark" style="margin-top:14px" onclick="downloadCompleted()">Download signed PDF</button>
      </div>
    </div>
  `;
}

async function downloadCompleted() {
  showProcessing('Preparing download…', 'Retrieving document.');
  const result = await api('completedDocument', { token: state.signToken });
  hideProcessing();

  if (!result.success) { toast(result.message); return; }

  const bytes = Uint8Array.from(atob(result.data.pdfBase64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = result.data.documentName || 'Goodpwr-Solar-Signed.pdf';
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

render();

</script>
</body>
</html>
