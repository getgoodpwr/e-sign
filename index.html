<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Goodpwr Solar</title>

<style>
:root{
  --bg:#f3f3f1;
  --panel:#fff;
  --soft:#f7f7f5;
  --ink:#25272a;
  --muted:#74777a;
  --line:#dedfdd;
  --dark:#303236;
  --accent:#666a70;
  --danger:#9a3f3f;
  --success:#456b4d;
  --shadow:0 10px 30px rgba(0,0,0,.07)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,
input,
select,
textarea{
  font:inherit
}

button{
  cursor:pointer
}

.top{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 24px;
  gap:24px;
  position:sticky;
  top:0;
  z-index:30
}

.brand{
  font:600 22px Georgia,serif;
  letter-spacing:-.5px
}

.nav{
  display:flex;
  gap:4px;
  height:100%;
  align-items:center
}

.nav button{
  border:0;
  background:none;
  padding:10px 13px;
  color:var(--muted);
  border-radius:7px
}

.nav button.active,
.nav button:hover{
  background:#f0f0ee;
  color:var(--ink)
}

.spacer{
  flex:1
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#34373a;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px
}

.userbox{
  display:flex;
  align-items:center;
  gap:9px
}

.userbox small{
  display:block;
  color:var(--muted);
  font-size:11px
}

.shell{
  display:flex;
  min-height:calc(100vh - 64px)
}

.side{
  width:230px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 14px
}

.side h4{
  margin:0 10px 10px;
  color:#999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px
}

.side button{
  display:flex;
  width:100%;
  border:0;
  background:none;
  padding:10px 11px;
  border-radius:7px;
  text-align:left;
  color:#5d6063;
  margin-bottom:2px
}

.side button:hover,
.side button.active{
  background:#f0f0ee;
  color:#222
}

.main{
  flex:1;
  padding:30px 34px;
  min-width:0
}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px
}

.page-title h1{
  font:500 30px Georgia,serif;
  margin:0 0 5px
}

.sub{
  color:var(--muted)
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:#333;
  border-radius:7px;
  padding:9px 13px
}

.btn:hover{
  background:#f3f3f1
}

.btn.dark{
  background:#303236;
  border-color:#303236;
  color:#fff
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 7px rgba(0,0,0,.02)
}

.template-card{
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.template-name{
  font-weight:600
}

.meta{
  font-size:12px;
  color:var(--muted)
}

.card-actions{
  display:flex;
  gap:7px;
  align-items:center
}

.empty{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #cfd0ce;
  border-radius:10px;
  background:rgba(255,255,255,.5)
}

.status-chip{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:20px;
  background:#f0f0ee;
  color:#555;
  font-size:11px
}

.status-chip.action{ background:#f4ece7; color:#80563f }
.status-chip.pending{ background:#efefec; color:#626262 }
.status-chip.completed{ background:#e9f0ea; color:#4e6853 }

.editor-top{
  height:60px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:8px
}

.editor-name{
  min-width:220px;
  font-weight:600
}
