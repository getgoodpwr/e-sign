<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Goodpwr Solar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
:root{
  --bg:#f3f3f1;
  --panel:#fff;
  --soft:#f7f7f5;
  --ink:#25272a;
  --muted:#74777a;
  --line:#dedfdd;
  --dark:#303236;
  --accent:#666a70;
  --danger:#9a3f3f;
  --success:#456b4d;
  --shadow:0 10px 30px rgba(0,0,0,.07)
}

*{ box-sizing:border-box }
body{ margin:0; background:var(--bg); color:var(--ink); font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
button, input, select, textarea{ font:inherit }
button{ cursor:pointer }

.top{ height:64px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 24px; gap:24px; position:sticky; top:0; z-index:30 }
.brand{ font:600 22px Georgia,serif; letter-spacing:-.5px }
.nav{ display:flex; gap:4px; height:100%; align-items:center }
.nav button{ border:0; background:none; padding:10px 13px; color:var(--muted); border-radius:7px }
.nav button.active, .nav button:hover{ background:#f0f0ee; color:var(--ink) }
.spacer{ flex:1 }

.avatar{ width:34px; height:34px; border-radius:50%; background:#34373a; color:#fff; display:grid; place-items:center; font-size:12px }
.userbox{ display:flex; align-items:center; gap:9px }
.userbox small{ display:block; color:var(--muted); font-size:11px }

.shell{ display:flex; min-height:calc(100vh - 64px) }
.side{ width:230px; background:#fff; border-right:1px solid var(--line); padding:22px 14px }
.side h4{ margin:0 10px 10px; color:#999; font-size:10px; text-transform:uppercase; letter-spacing:1.3px }
.side button{ display:flex; width:100%; border:0; background:none; padding:10px 11px; border-radius:7px; text-align:left; color:#5d6063; margin-bottom:2px }
.side button:hover, .side button.active{ background:#f0f0ee; color:#222 }

.main{ flex:1; padding:30px 34px; min-width:0 }
.page-title{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:25px }
.page-title h1{ font:500 30px Georgia,serif; margin:0 0 5px }
.sub{ color:var(--muted) }

.btn{ border:1px solid var(--line); background:#fff; color:#333; border-radius:7px; padding:9px 13px }
.btn:hover{ background:#f3f3f1 }
.btn.dark{ background:#303236; border-color:#303236; color:#fff }

.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px }
.card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 2px 7px rgba(0,0,0,.02) }
.template-card{ min-height:150px; display:flex; flex-direction:column; justify-content:space-between }
.template-name{ font-weight:600 }
.meta{ font-size:12px; color:var(--muted) }
.card-actions{ display:flex; gap:7px; align-items:center }

.empty{ padding:70px 20px; text-align:center; color:var(--muted); border:1px dashed #cfd0ce; border-radius:10px; background:rgba(255,255,255,.5) }
.status-chip{ display:inline-flex; align-items:center; padding:4px 8px; border-radius:20px; background:#f0f0ee; color:#555; font-size:11px }
.status-chip.action{ background:#f4ece7; color:#80563f }
.status-chip.pending{ background:#efefec; color:#626262 }
.status-chip.completed{ background:#e9f0ea; color:#4e6853 }

/* Editor Layout */
.editor-top{ height:60px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; gap:8px }
.editor-name{ min-width:220px; font-weight:600 }
.editor-layout{ display:grid; grid-template-columns:190px minmax(450px,1fr) 270px; height:calc(100vh - 124px); overflow:hidden }
.toolbox, .properties{ background:#fff; overflow:auto }
.toolbox{ border-right:1px solid var(--line); padding:16px 12px }
.properties{ border-left:1px solid var(--line); padding:18px }
.toolgroup{ margin-bottom:18px }
.toolgroup h5{ margin:0 8px 8px; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#999 }
.field-tool{ width:100%; border:1px solid var(--line); background:#fff; border-radius:7px; padding:9px 10px; margin:3px 0; text-align:left; color:#444 }
.field-tool:hover{ background:#f4f4f2 }

.canvas-wrap{ overflow:auto; padding:30px; background:#e9e9e6 }
.doc-page{ position:relative; margin:0 auto 25px; background:#fff; box-shadow:0 5px 20px rgba(0,0,0,.13); width:min(820px,90%) }
.doc-page canvas{ width:100%; height:auto; display:block }

.overlay{ position:absolute; inset:0; pointer-events:none }
.field{
  position:absolute; border:1px solid #7b7e82; background:rgba(244,244,242,.88); border-radius:3px;
  display:flex; align-items:center; justify-content:center; min-width:18px; min-height:18px;
  user-select:none; touch-action:none; cursor:move; pointer-events:auto;
}
.field.selected{ border:2px solid #36393c; background:rgba(232,232,228,.92); z-index:10 }
.field .tag{ font-size:10px; color:#505256; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px; pointer-events:none }
.field .delete{ position:absolute; right:-8px; top:-8px; width:17px; height:17px; border-radius:50%; border:0; background:#303236; color:#fff; font-size:12px; line-height:17px; padding:0; display:none; cursor:pointer; z-index:15; pointer-events:auto }
.field.selected .delete{ display:block }
.resize{ position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:#303236; border-radius:2px; display:none; cursor:nwse-resize; z-index:20; pointer-events:auto }
.field.selected .resize{ display:block }

.field input, .field select{ width:100%; height:100%; border:0; background:transparent; outline:0; padding:3px; font-size:11px }

/* Modal & Toast */
.modal{ position:fixed; inset:0; background:rgba(20,20,20,.38); display:flex; align-items:center; justify-content:center; z-index:100 }
.modal-card{ background:#fff; width:min(470px,92vw); max-height:90vh; overflow:auto; border-radius:12px; padding:25px; box-shadow:var(--shadow) }
.modal-card h2{ font:500 25px Georgia,serif; margin:0 0 7px }
.modal-card input, .modal-card select{ width:100%; padding:10px; border:1px solid var(--line); border-radius:7px; margin:6px 0 10px }
.modal-actions{ display:flex; justify-content:flex-end; gap:7px; margin-top:14px }
.toast{ position:fixed; right:22px; bottom:22px; background:#303236; color:#fff; padding:11px 15px; border-radius:7px; z-index:200; box-shadow:var(--shadow); max-width:420px }

/* Signing */
.sign-shell{ max-width:1050px; margin:0 auto; padding:28px }
.sign-head{ background:#fff; border:1px solid var(--line); padding:16px 20px; border-radius:10px; display:flex; align-items:center; gap:15px; margin-bottom:18px }
.sign-doc{ background:#e9e9e6; padding:25px }
.sign-page{ position:relative; margin:0 auto 20px; background:#fff; box-shadow:0 4px 15px rgba(0,0,0,.12); max-width:820px }
.sign-page canvas{ width:100%; display:block }
.sign-page .field{ border:1px solid #aaa; background:#fafaf8 }
.sign-page .field.assigned{ border:2px solid #3f4347; background:#f0f0ed }
.sign-footer{ display:flex; justify-content:flex-end; margin-top:18px }
.notice{ padding:11px 13px; background:#f5f5f2; border:1px solid var(--line); border-radius:7px; color:#5f6265 }

.processing-overlay{ position:fixed; inset:0; background:rgba(243,243,241,.86); display:flex; align-items:center; justify-content:center; z-index:500 }
.processing-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 34px; text-align:center; box-shadow:var(--shadow); min-width:280px }
.spinner{ width:30px; height:30px; border:3px solid #ddd; border-top-color:#303236; border-radius:50%; animation:siSpin .8s linear infinite; margin:0 auto 14px }
@keyframes siSpin{ to{transform:rotate(360deg)} }
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const API =
  'https://script.google.com/macros/s/AKfycbyAwa7xpeJmEDR993pVT-eO7iE95mEaF-FvIZsDd0elbpMDMGkrkWmn8FOlkFf1zQs/exec';

const state = {
  token: localStorage.getItem('si_token') || '',
  user: JSON.parse(localStorage.getItem('si_user') || 'null'),
  view: 'dashboard',
  section: 'saved',
  templates: [],
  dashboard: null,
  pdf: null,
  fields: [],
  pages: [],
  renderedPages: null,
  selected: null,
  tool: null,
  editorTemplateId: null,
  editorName: '',
  recipients: [],
  signingMode: 'sequential',
  signToken: new URLSearchParams(location.search).get('token'),
  completedMode: new URLSearchParams(location.search).get('completed') === '1',
  signingBusy: false,
  sendBusy: false,
  signSession: null
};

const $ = function(s) { return document.querySelector(s); };
function esc(v) { return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }

function toast(m) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = m;
  $('#toastRoot').append(el); setTimeout(() => el.remove(), 3000);
}

function initials(n) { return String(n || 'U').split(/\s+/).slice(0,2).map(x => x[0]).join('').toUpperCase(); }

function showProcessing(t, m) {
  let root = document.getElementById('processingRoot') || document.createElement('div');
  root.id = 'processingRoot'; document.body.append(root);
  root.innerHTML = `<div class="processing-overlay"><div class="processing-card"><div class="spinner"></div><div style="font:500 20px Georgia,serif;margin-bottom:7px">${esc(t)}</div><div class="sub">${esc(m)}</div></div></div>`;
}
function hideProcessing() { const root = document.getElementById('processingRoot'); if (root) root.remove(); }

async function api(action, data = {}) {
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: state.token || '', data })
    });
    const raw = await res.text();
    const result = JSON.parse(raw);
    if (!result.success && result.error === 'UNAUTHORIZED') logoutLocal();
    return result;
  } catch (err) {
    return { success: false, message: 'Could not reach backend.' };
  }
}

function logoutLocal() {
  state.token = ''; state.user = null;
  localStorage.removeItem('si_token'); localStorage.removeItem('si_user');
  render();
}

function showLogin() {
  modal(`
    <h2>Sign In to Goodpwr Solar</h2>
    <div class="sub" style="margin-bottom:12px">Enter your details to access the workspace.</div>
    <label>Full Name</label>
    <input id="mName" type="text" placeholder="John Doe">
    <label>Email Address</label>
    <input id="mEmail" type="email" placeholder="name@getgoodpwr.com">
    <div id="mErr" class="small" style="min-height:18px;color:var(--danger)"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" id="loginButton" onclick="doLogin()">Sign In</button>
    </div>
  `);
}

function modal(html) { $('#modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`; }
function closeModal() { $('#modalRoot').innerHTML = ''; }

async function doLogin() {
  const button = $('#loginButton'); if (button) { button.disabled = true; button.textContent = 'Signing in…'; }
  const name = $('#mName') ? $('#mName').value.trim() : '';
  const email = $('#mEmail') ? $('#mEmail').value.trim() : '';

  if (!email) {
    if ($('#mErr')) $('#mErr').textContent = 'Email is required.';
    if (button) { button.disabled = false; button.textContent = 'Sign In'; }
    return;
  }

  const result = await api('login', { name, email });
  if (!result.success) {
    if ($('#mErr')) $('#mErr').textContent = result.message || 'Unable to sign in.';
    if (button) { button.disabled = false; button.textContent = 'Sign In'; }
    return;
  }

  state.token = result.data.token;
  state.user = result.data;
  localStorage.setItem('si_token', state.token);
  localStorage.setItem('si_user', JSON.stringify(state.user));

  closeModal();
  state.view = 'dashboard';
  render();
  toast('Welcome ' + state.user.name + '.');
}

async function doLogout() {
  if (state.token) await api('logout');
  logoutLocal();
}

function render() {
  if (state.signToken) {
    if (state.completedMode) renderCompletedDocument();
    else renderSigner();
    return;
  }
  if (!state.token) { renderLanding(); return; }
  if (state.view === 'editor') { renderEditor(); return; }
  renderApp();
}

function renderLanding() {
  $('#app').innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center">
      <div style="text-align:center;max-width:540px;padding:30px">
        <div class="brand" style="font-size:38px;margin-bottom:15px">Goodpwr Solar</div>
        <h1 style="font:500 34px Georgia,serif">Document & E-Signing Portal</h1>
        <p class="sub" style="line-height:1.7">
          Administrators (@getgoodpwr.com) can build and dispatch templates.
          Signers receive secure links to sign documents smoothly.
        </p>
        <button class="btn dark" onclick="showLogin()">Sign In</button>
      </div>
    </div>
  `;
}

function renderApp() {
  const user = state.user || {};
  const isAdmin = user.role === 'admin';

  $('#app').innerHTML = `
    <header class="top">
      <div class="brand">Goodpwr Solar</div>
      <nav class="nav"><button class="active">Workspace</button></nav>
      <div class="spacer"></div>
      <div class="userbox">
        <div class="avatar">${initials(user.name)}</div>
        <div>
          <b>${esc(user.name)}</b>
          <small>${esc(user.role)}</small>
        </div>
      </div>
      <button class="btn" onclick="doLogout()">Sign out</button>
    </header>

    <div class="shell">
      <aside class="side">
        <h4>Workspace</h4>
        ${sideBtn('saved','Saved')}
        ${sideBtn('created','Created by Me')}
        ${sideBtn('recent','Recently Used')}
        ${sideBtn('favorites','Favorites')}

        <h4 style="margin-top:25px">Signing</h4>
        ${sideBtn('action','Action Required')}
        ${sideBtn('pending','Pending')}
        ${sideBtn('completed','Completed')}

        <h4 style="margin-top:25px">Manage</h4>
        ${sideBtn('templates','Templates')}
      </aside>

      <main class="main" id="main"></main>
    </div>
  `;

  loadDashboard();
}

function sideBtn(key, label) {
  return `<button class="${state.section === key ? 'active' : ''}" onclick="state.section='${key}';loadDashboard()">${esc(label)}</button>`;
}

async function loadDashboard() {
  const main = $('#main'); if (!main) return;
  main.innerHTML = '<div class="sub">Loading workspace…</div>';

  const result = await api('listDashboard');
  if (!result.success) {
    main.innerHTML = `<div class="empty"><b>Unable to load workspace.</b><br>${esc(result.message)}</div>`;
    return;
  }

  state.dashboard = result.data || {};
  const user = state.user || {};
  const isAdmin = user.role === 'admin';

  let list = state.dashboard.saved || [];
  let title = 'Saved Templates';

  main.innerHTML = `
    <div class="page-title">
      <div>
        <h1>${esc(title)}</h1>
        <div class="sub">Goodpwr Solar Workspace</div>
      </div>
      <div>
        ${isAdmin ? `<button class="btn dark" onclick="newTemplate()">+ Create template</button>` : ''}
      </div>
    </div>

    ${list.length ? `<div class="cards">${list.map(templateCard).join('')}</div>` : `
      <div class="empty">
        <b>No templates found.</b>
        <div style="margin-top:7px">${isAdmin ? 'Create a template to get started.' : 'Templates managed by Goodpwr administrators will appear here.'}</div>
      </div>
    `}
  `;
}

function templateCard(t) {
  const isAdmin = state.user?.role === 'admin';
  return `
    <div class="card template-card">
      <div>
        <div style="display:flex;justify-content:space-between;gap:8px">
          <div class="template-name">${esc(t.name)}</div>
        </div>
      </div>
      <div class="card-actions">
        ${isAdmin ? `
          <button class="btn" onclick="openTemplate('${esc(t.templateId||t.id||'')}')">Open</button>
          <button class="btn" onclick="startSend('${esc(t.templateId||t.id||'')}')">Send</button>
        ` : `<span class="sub" style="font-size:11px">Signer access only</span>`}
      </div>
    </div>
  `;
}

/* =========================================================
   PHASE 1: TEMPLATE EDITOR & FIELD PLACEMENT
   ========================================================= */

async function newTemplate() {
  if (state.user?.role !== 'admin') { toast('Administrator permissions required.'); return; }
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/pdf';
  input.onchange = async function() {
    const file = input.files[0]; if (!file) return;
    state.editorTemplateId = null; state.editorName = ''; state.fields = []; state.selected = null;
    await loadEditorPdf(await file.arrayBuffer());
    state.view = 'editor'; render();
  };
  input.click();
}

async function openTemplate(id) {
  const result = await api('getTemplate', { templateId: id });
  if (!result.success) { toast(result.message); return; }

  state.editorTemplateId = id;
  state.fields = result.data.fields || [];
  state.selected = null;
  await loadEditorPdf(fromB64(result.data.pdfBase64));
  state.editorName = result.data.name;
  state.view = 'editor';
  render();
}

function fromB64(v) { return Uint8Array.from(atob(v), c => c.charCodeAt(0)).buffer; }
function toB64(buffer) {
  const bytes = new Uint8Array(buffer); let out = '';
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(out);
}

async function loadEditorPdf(buffer) {
  state.pdf = buffer;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
  state.pages = []; state.renderedPages = [];

  const holder = document.createElement('div');
  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

    const pageElement = document.createElement('div'); pageElement.className = 'doc-page';
    const overlay = document.createElement('div'); overlay.className = 'overlay'; overlay.dataset.page = pageNumber - 1;

    pageElement.append(canvas, overlay);
    state.pages.push({ ov: overlay, ratio: viewport.width / viewport.height });
    holder.append(pageElement);
  }
  state.renderedPages = Array.from(holder.children);
}

function renderEditor() {
  if (!state.renderedPages) { renderLanding(); return; }

  $('#app').innerHTML = `
    <div class="editor-top">
      <button class="btn" onclick="state.view='dashboard';render()">← Back</button>
      <div class="editor-name">${esc(state.editorName || 'Untitled template')}</div>
      <div class="spacer"></div>
      <button class="btn" onclick="saveTemplate()">Save</button>
      <button class="btn dark" onclick="startSend('${esc(state.editorTemplateId || '')}')">Send</button>
    </div>

    <div class="editor-layout">
      <aside class="toolbox">
        <div class="toolgroup">
          <h5>Standard</h5>
          ${tool('signature','Signature')}
          ${tool('initials','Initials')}
          ${tool('name','Name')}
          ${tool('email','Email')}
          ${tool('date','Date')}
        </div>
        <div class="toolgroup">
          <h5>Input</h5>
          ${tool('text','Text')}
          ${tool('long_text','Long text')}
          ${tool('number','Number')}
        </div>
        <div class="toolgroup">
          <h5>Selection</h5>
          ${tool('checkbox','Checkbox')}
          ${tool('dropdown','Dropdown')}
        </div>
      </aside>

      <main class="canvas-wrap" id="canvasWrap"></main>
      <aside class="properties" id="properties">
        <div class="small">Select a field to edit its properties.</div>
      </aside>
    </div>
  `;

  const canvasWrap = $('#canvasWrap');
  state.renderedPages.forEach(p => canvasWrap.append(page));
  state.pages = state.renderedPages.map((page, index) => ({
    ov: page.querySelector('.overlay'),
    ratio: state.pages[index] ? state.pages[index].ratio : 1
  }));

  state.tool = null;
  renderFields();
}

function tool(type, label) { return `<button class="field-tool" onclick="selectTool('${type}')">${esc(label)}</button>`; }
function selectTool(type) { state.tool = state.tool === type ? null : type; toast(state.tool ? 'Click document to place ' + type : 'Cancelled field tool'); }

function placeField(event, overlay) {
  if (!state.tool) return;
  const rect = overlay.getBoundingClientRect();
  const sizes = { signature:[.28,.07], initials:[.12,.05], text:[.25,.04], date:[.18,.04], checkbox:[.035,.035], dropdown:[.25,.04] };
  const size = sizes[state.tool] || [.2,.04];
  const w = size[0]; const h = size[1];

  const x = Math.max(0, Math.min((event.clientX - rect.left) / rect.width, 1 - w));
  const y = Math.max(0, Math.min((event.clientY - rect.top) / rect.height, 1 - h));

  const newField = {
    id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
    type: state.tool, page: +overlay.dataset.page,
    x, y, w, h, required: state.tool !== 'checkbox', recipientRole: '1', value: state.tool === 'checkbox' ? false : '',
    properties: { options: ['Option 1', 'Option 2'] }
  };

  state.fields.push(newField);
  state.selected = newField.id;
  state.tool = null;
  renderFields();
}

function dragField(event, field, element, kind) {
  event.preventDefault(); event.stopPropagation();
  state.selected = field.id;
  const overlay = element.parentElement; const rect = overlay.getBoundingClientRect();
  const startX = event.clientX; const startY = event.clientY;
  const oldX = field.x; const oldY = field.y; const oldW = field.w; const oldH = field.h;

  const move = function(ev) {
    ev.preventDefault(); ev.stopPropagation();
    const dx = (ev.clientX - startX) / rect.width;
    const dy = (ev.clientY - startY) / rect.height;

    if (kind === 'move') {
      field.x = Math.min(Math.max(oldX + dx, 0), 1 - field.w);
      field.y = Math.min(Math.max(oldY + dy, 0), 1 - field.h);
    } else if (kind === 'resize') {
      field.w = Math.min(Math.max(oldW + dx, 0.03), 1 - field.x);
      field.h = Math.min(Math.max(oldH + dy, 0.02), 1 - field.y);
    }

    element.style.left = (field.x * 100) + '%'; element.style.top = (field.y * 100) + '%';
    element.style.width = (field.w * 100) + '%'; element.style.height = (field.h * 100) + '%';
  };

  const up = function() {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    renderFields();
  };

  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

function renderFields() {
  state.pages.forEach(page => {
    page.ov.innerHTML = ''; page.ov.parentElement.style.pointerEvents = 'auto';
    page.ov.parentElement.onclick = function(event) {
      if (event.target === page.ov || event.target.tagName === 'CANVAS') placeField(event, page.ov);
    };
  });

  state.fields.forEach(field => {
    const element = document.createElement('div');
    element.className = 'field' + (state.selected === field.id ? ' selected' : '');
    element.style.cssText = `left:${field.x * 100}%;top:${field.y * 100}%;width:${field.w * 100}%;height:${field.h * 100}%`;

    element.onpointerdown = function(event) {
      if (event.target.classList.contains('delete') || event.target.classList.contains('resize')) return;
      dragField(event, field, element, 'move');
    };

    const deleteButton = document.createElement('button'); deleteButton.className = 'delete'; deleteButton.textContent = '×';
    deleteButton.onclick = function(event) {
      event.stopPropagation(); state.fields = state.fields.filter(x => x.id !== field.id);
      state.selected = null; renderFields();
    };
    element.append(deleteButton);

    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = field.type === 'checkbox' ? '☐' : field.type.replace('_', ' ');
    element.append(tag);

    const resize = document.createElement('div'); resize.className = 'resize';
    resize.onpointerdown = function(event) { dragField(event, field, element, 'resize'); };
    element.append(resize);

    if (state.pages[field.page]) state.pages[field.page].ov.append(element);
  });

  renderProperties();
}

function renderProperties() {
  const panel = $('#properties'); if (!panel) return;
  const field = state.fields.find(x => x.id === state.selected);
  if (!field) { panel.innerHTML = `<div class="small">Select a field to edit its properties.</div>`; return; }

  panel.innerHTML = `
    <div class="prop">
      <h3>${esc(field.type.replace('_', ' '))}</h3>
      <label>Assigned Signer</label>
      <select id="pRecipient">
        <option value="1" ${field.recipientRole === '1' ? 'selected' : ''}>Signer 1</option>
        <option value="2" ${field.recipientRole === '2' ? 'selected' : ''}>Signer 2</option>
        <option value="3" ${field.recipientRole === '3' ? 'selected' : ''}>Signer 3</option>
      </select>

      <label>Required</label>
      <select id="pReq">
        <option value="1" ${field.required ? 'selected' : ''}>Required</option>
        <option value="0" ${!field.required ? 'selected' : ''}>Optional</option>
      </select>
    </div>
  `;

  $('#pRecipient').onchange = e => { field.recipientRole = e.target.value; };
  $('#pReq').onchange = e => { field.required = e.target.value === '1'; };
}

async function saveTemplate() {
  if (state.user?.role !== 'admin') { toast('Only administrators can save templates.'); return; }
  if (!state.pdf) { toast('No PDF loaded.'); return; }
  const name = state.editorName || prompt('Template name:', 'Untitled template'); if (!name) return;

  state.editorName = name;
  showProcessing('Saving template…', 'Uploading PDF & field definitions.');

  try {
    const result = await api('saveTemplate', {
      name, pdfBase64: toB64(state.pdf),
      fields: state.fields.map(f => ({
        page: f.page, type: f.type, x: f.x, y: f.y, w: f.w, h: f.h,
        required: f.required, recipientRole: f.recipientRole, properties: f.properties
      }))
    });

    hideProcessing();
    if (!result.success) { toast(result.message); return; }
    state.editorTemplateId = result.data.templateId; toast('Template saved.');
  } catch(e) { hideProcessing(); toast('Could not save template.'); }
}

/* =========================================================
   PHASE 2: ENVELOPE DISPATCH
   ========================================================= */

function startSend(templateId) {
  if (state.user?.role !== 'admin') { toast('Only administrators can send documents.'); return; }
  if (!templateId) { toast('Save template before sending.'); return; }
  if (state.sendBusy) return;

  state.recipients = [{ name:'', email:'' }]; state.signingMode = 'sequential';
  modal(`
    <h2>Send document</h2>
    <div class="sub">Add signers and choose their signing order.</div>
    <label>Signing Mode</label>
    <select id="sendMode">
      <option value="sequential">Sequential — one signer at a time</option>
      <option value="parallel">Parallel — all signers at once</option>
    </select>
    <div id="recList"></div>
    <button class="btn" onclick="addRecRow()">+ Add signer</button>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" id="createSendButton" onclick="createAndSend('${esc(templateId)}')">Create & send</button>
    </div>
  `);
  renderRecRows();
}

function renderRecRows() {
  const box = $('#recList'); if (!box) return;
  box.innerHTML = state.recipients.map((recipient, index) => `
    <div class="card" style="margin:10px 0;padding:12px">
      <b>Signer ${index + 1}</b>
      <input id="rn${index}" placeholder="Full name" value="${esc(recipient.name)}">
      <input id="re${index}" placeholder="Email" value="${esc(recipient.email)}">
    </div>
  `).join('');
}

function addRecRow() { state.recipients.push({ name:'', email:'' }); renderRecRows(); }
function getFrontendUrl() { return (location.origin + location.pathname).replace(/\/+$/, ''); }

async function createAndSend(templateId) {
  if (state.sendBusy) return;
  state.recipients = state.recipients.map((r, i) => ({
    name: $('#rn' + i) ? $('#rn' + i).value.trim() : '',
    email: $('#re' + i) ? $('#re' + i).value.trim() : ''
  }));

  if (state.recipients.some(r => !r.name || !r.email)) { toast('Complete all signer details.'); return; }
  const signingUrl = getFrontendUrl(); if (!signingUrl) { toast('Invalid application URL.'); return; }

  state.sendBusy = true; showProcessing('Sending document…', 'Creating envelope & issuing invitations.');

  try {
    const mode = $('#sendMode') ? $('#sendMode').value : 'sequential';
    const created = await api('createEnvelope', { templateId, signingMode: mode, recipients: state.recipients });
    if (!created.success) { hideProcessing(); state.sendBusy = false; toast(created.message); return; }

    const sent = await api('sendEnvelope', { envelopeId: created.data.envelopeId, signingUrl });
    hideProcessing(); state.sendBusy = false;

    if (!sent.success) { toast(sent.message); return; }
    closeModal(); toast('Document dispatched successfully.'); state.section = 'pending'; loadDashboard();
  } catch(e) { hideProcessing(); state.sendBusy = false; toast('Error dispatching document.'); }
}

/* =========================================================
   PHASE 3 & 4: SIGNING EXECUTION & PDF BURNING
   ========================================================= */

async function renderSigner() {
  showProcessing('Loading document…', 'Retrieving secure signing session.');
  const result = await api('signingSession', { token: state.signToken });
  hideProcessing();

  if (!result.success) {
    $('#app').innerHTML = `<div class="sign-shell"><div class="empty"><h2>Link Unavailable</h2><div>${esc(result.message)}</div></div></div>`;
    return;
  }

  state.signSession = result.data;
  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="sign-head">
        <div><div class="brand">Goodpwr Solar</div><div class="small">Secure Signing</div></div>
        <div class="spacer"></div>
        <div class="notice">Signing as <b>${esc(result.data.recipient.name)}</b></div>
      </div>
      <div class="sign-doc" id="signDoc"></div>
      <div class="sign-footer">
        <button class="btn dark" id="finishSigningButton" onclick="submitSigner()">Finish signing</button>
      </div>
    </div>
  `;

  await renderSignPdf(result.data);
}

async function renderSignPdf(data) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(fromB64(data.pdfBase64)) }).promise;
  const host = $('#signDoc'); if (!host) return;

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

    const pageElement = document.createElement('div'); pageElement.className = 'sign-page';
    const overlay = document.createElement('div'); overlay.className = 'overlay';
    pageElement.append(canvas, overlay); host.append(pageElement);

    data.fields.filter(f => f.page === pageNumber - 1).forEach(field => {
      const element = document.createElement('div');
      const owned = !field.recipientRole || String(field.recipientRole) === String(data.recipient.sequence);
      element.className = 'field' + (owned ? ' assigned' : '');
      element.style.cssText = `left:${field.x * 100}%;top:${field.y * 100}%;width:${field.w * 100}%;height:${field.h * 100}%`;

      if (!owned) { element.style.pointerEvents = 'none'; return; }

      if (field.type === 'signature' || field.type === 'initials') {
        element.textContent = field.value ? 'Signed' : 'Click to sign';
        element.onclick = () => signatureFor(field, element);
      } else if (field.type === 'checkbox') {
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
        checkbox.checked = field.value === true || field.value === 'true';
        checkbox.onchange = () => { field.value = checkbox.checked; };
        element.append(checkbox);
      } else if (field.type === 'date') {
        const input = document.createElement('input'); input.type = 'date';
        input.value = field.value || ''; input.oninput = () => { field.value = input.value; };
        element.append(input);
      } else {
        const input = document.createElement('input'); input.type = field.type === 'number' ? 'number' : 'text';
        input.value = field.value || ''; input.oninput = () => { field.value = input.value; };
        element.append(input);
      }
      overlay.append(element);
    });
  }
}

let sigTarget = null, sigTargetElement = null;

function signatureFor(field, element) {
  sigTarget = field; sigTargetElement = element;
  modal(`
    <h2>Your signature</h2>
    <canvas id="sigPad" width="600" height="180" style="width:100%;border:1px dashed #aaa;border-radius:7px;touch-action:none"></canvas>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" onclick="applySignerSig()">Apply</button>
    </div>
  `);

  const canvas = $('#sigPad'), ctx = canvas.getContext('2d'); let drawing = false;
  canvas.onpointerdown = e => {
    drawing = true; canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect(); ctx.beginPath();
    ctx.moveTo((e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height);
  };
  canvas.onpointermove = e => {
    if (!drawing) return; const rect = canvas.getBoundingClientRect();
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.lineTo((e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height); ctx.stroke();
  };
  canvas.onpointerup = () => { drawing = false; };
}

function applySignerSig() {
  const canvas = $('#sigPad'); if (!canvas || !sigTarget) return;
  sigTarget.value = canvas.toDataURL('image/png');
  closeModal();
  if (sigTargetElement) { sigTargetElement.textContent = 'Signed'; sigTargetElement.classList.add('assigned'); }
}

async function submitSigner() {
  if (state.signingBusy || !state.signSession) return;
  const values = {};

  for (const field of state.signSession.fields) {
    const owned = !field.recipientRole || String(field.recipientRole) === String(state.signSession.recipient.sequence);
    if (!owned) continue;

    if (field.required && (!field.value || String(field.value) === '')) {
      toast('Please complete all required fields.'); return;
    }
    if (field.type === 'number' && field.value && !/^[-+]?\d*(\.\d+)?$/.test(String(field.value))) {
      toast('Numbers only allowed in number fields.'); return;
    }
    values[field.id] = field.value;
  }

  state.signingBusy = true; showProcessing('Processing signature…', 'Burning fields to PDF.');

  try {
    const finalPdfBase64 = await buildCompletedPdf();
    const result = await api('submitSigning', {
      token: state.signToken, values, pdfBase64: finalPdfBase64, signingUrl: getFrontendUrl()
    });

    hideProcessing();
    if (!result.success) { state.signingBusy = false; toast(result.message); return; }

    $('#app').innerHTML = `
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:12px">Goodpwr Solar</div>
          <h2>Thank you!</h2>
          <div>Your signing step has been completed successfully.</div>
        </div>
      </div>
    `;
  } catch(e) { hideProcessing(); state.signingBusy = false; toast('Error submitting signature.'); }
}

async function buildCompletedPdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.load(fromB64(state.signSession.pdfBase64));
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const currentSeq = String(state.signSession.recipient.sequence);
  const pages = pdfDoc.getPages();

  for (const field of state.signSession.fields) {
    const owned = !field.recipientRole || String(field.recipientRole) === currentSeq;
    if (!owned || field.value === undefined || field.value === null || String(field.value) === '') continue;

    const page = pages[Number(field.page) || 0];
    const pw = page.getWidth(), ph = page.getHeight();
    const x = field.x * pw, y = ph - ((field.y + field.h) * ph), w = field.w * pw, h = field.h * ph;

    if (field.type === 'signature' || field.type === 'initials') {
      if (String(field.value).startsWith('data:image/')) {
        const raw = String(field.value).split(',')[1];
        const bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
        const image = await pdfDoc.embedPng(bytes);
        page.drawImage(image, { x, y, width: w, height: h });
      }
    } else if (field.type === 'checkbox') {
      if (field.value === true || String(field.value) === 'true') {
        page.drawText('X', { x: x + (w / 3), y: y + (h / 4), size: 12, font, color: rgb(0.15, 0.15, 0.15) });
      }
    } else {
      page.drawText(String(field.value), { x: x + 2, y: y + 2, size: 10, font, color: rgb(0.15, 0.15, 0.15) });
    }
  }

  return toB64(await pdfDoc.save());
}

async function renderCompletedDocument() {
  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="empty">
        <div class="brand" style="margin-bottom:12px">Goodpwr Solar</div>
        <h2>Completed Document Ready</h2>
        <button class="btn dark" style="margin-top:14px" onclick="downloadCompleted()">Download signed PDF</button>
      </div>
    </div>
  `;
}

async function downloadCompleted() {
  showProcessing('Preparing download…', 'Retrieving official document.');
  const result = await api('completedDocument', { token: state.signToken });
  hideProcessing();

  if (!result.success) { toast(result.message); return; }

  const bytes = Uint8Array.from(atob(result.data.pdfBase64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url; anchor.download = result.data.documentName || 'Goodpwr-Solar-Signed.pdf';
  document.body.append(anchor); anchor.click(); anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

render();

</script>
</body>
</html>
