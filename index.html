<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>SignedIt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-indigo-400">SignedIt</h1>
      <div id="nav-status" class="text-sm text-slate-400">Loading...</div>
    </header>

    <main id="main-content">
      <div class="text-center py-20 text-slate-400">Verifying session...</div>
    </main>
  </div>

  <!-- Signature Modal -->
  <div id="sig-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full">
      <h3 class="text-lg font-bold mb-3">Draw Your Signature</h3>
      <div class="border border-slate-700 bg-white rounded-lg overflow-hidden mb-4">
        <canvas id="sig-canvas" width="380" height="150" class="w-full cursor-crosshair"></canvas>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="clearSigCanvas()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm">Clear</button>
        <button onclick="closeSigModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm">Cancel</button>
        <button onclick="saveSigCanvas()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold">Apply</button>
      </div>
    </div>
  </div>

  <script>
    let state = { view: 'loading', token: null, session: null, templates: [], selectedTemplate: null, fields: [] };

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      state.token = urlParams.get('token');
      
      if (state.token) {
        // Signer mode: bypass admin auth check, anyone can sign
        loadSigningSession();
      } else {
        // Admin mode: verify @getgoodpwr.com login
        checkAccess();
      }
    };

    function checkAccess() {
      google.script.run.withSuccessHandler(res => {
        if (res.authorized) {
          document.getElementById('nav-status').innerText = `Logged in: ${res.email}`;
          loadDashboard();
        } else {
          document.getElementById('main-content').innerHTML = `
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-xl text-center max-w-lg mx-auto my-12">
              <h2 class="text-xl font-bold text-red-400 mb-2">Access Restricted</h2>
              <p class="text-slate-300 text-sm mb-4">${res.message}</p>
              ${res.email ? `<p class="text-xs text-slate-500">Detected account: ${res.email}</p>` : ''}
            </div>`;
          document.getElementById('nav-status').innerText = 'Unauthorized';
        }
      }).checkUserAccess();
    }

    function render() {
      const main = document.getElementById('main-content');
      
      if (state.view === 'dashboard') {
        main.innerHTML = `
          <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
              <h2 class="text-xl font-semibold mb-4 text-indigo-300">1. Create Template</h2>
              <input type="text" id="t-name" placeholder="Template Name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 mb-3 text-sm">
              <input type="file" id="t-file" accept="application/pdf" class="w-full text-sm text-slate-400 mb-4 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
              <button onclick="handleTemplateUpload()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold text-sm">Upload Template</button>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
              <h2 class="text-xl font-semibold mb-4 text-indigo-300">Existing Templates</h2>
              <div id="template-list" class="space-y-2 max-h-64 overflow-y-auto">Loading templates...</div>
            </div>
          </div>`;
        fetchTemplates();
      } else if (state.view === 'editor') {
        main.innerHTML = `
          <div class="mb-4 flex flex-wrap items-center justify-between gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div>
              <h2 class="font-bold text-lg">${state.selectedTemplate.name}</h2>
              <p class="text-xs text-slate-400">Click field tools, then click on the PDF to place them.</p>
            </div>
            <div class="flex gap-2">
              <button onclick="addField('signature')" class="px-3 py-1.5 bg-indigo-600 rounded text-xs font-semibold">Signature</button>
              <button onclick="addField('date')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs">Date</button>
              <button onclick="addField('text')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs">Text</button>
              <button onclick="addField('checkbox')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs">Checkbox</button>
            </div>
          </div>
          <div class="relative bg-slate-900 border border-slate-800 rounded-xl overflow-auto p-4 flex justify-center">
            <div id="pdf-container" class="relative inline-block shadow-2xl">
              <canvas id="pdf-canvas"></canvas>
              <div id="field-overlay" class="absolute inset-0"></div>
            </div>
          </div>
          <div class="mt-4 bg-slate-900 p-4 rounded-xl border border-slate-800 flex gap-4 items-center">
            <input type="text" id="signer-name" placeholder="Signer Name" class="bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm flex-1">
            <input type="email" id="signer-email" placeholder="Signer Email" class="bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm flex-1">
            <button onclick="sendEnvelope()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 rounded font-semibold text-sm">Send Envelope</button>
          </div>`;
        renderEditorFieldsOverlay();
      } else if (state.view === 'signing') {
        main.innerHTML = `
          <div class="mb-4 bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
              <h2 class="font-bold text-lg">${state.session.templateName}</h2>
              <p class="text-xs text-slate-400">Signer: ${state.session.signerName}</p>
            </div>
            <button onclick="submitSigningSession()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm">Finish & Submit</button>
          </div>
          <div class="relative bg-slate-900 border border-slate-800 rounded-xl overflow-auto p-4 flex justify-center">
            <div id="pdf-container" class="relative inline-block shadow-2xl">
              <canvas id="pdf-canvas"></canvas>
              <div id="signing-overlay" class="absolute inset-0"></div>
            </div>
          </div>`;
        renderSigningCanvas();
      }
    }

    function loadDashboard() {
      state.view = 'dashboard';
      render();
    }

    function fetchTemplates() {
      google.script.run.withSuccessHandler(temps => {
        state.templates = temps;
        const list = document.getElementById('template-list');
        if (!temps.length) {
          list.innerHTML = `<p class="text-xs text-slate-500">No templates found.</p>`;
          return;
        }
        list.innerHTML = temps.map(t => `
          <div class="flex justify-between items-center bg-slate-950 p-3 rounded-lg border border-slate-800 text-sm">
            <span>${t.name}</span>
            <button onclick="openEditor('${t.templateId}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Use</button>
          </div>`).join('');
      }).getTemplates();
    }

    function handleTemplateUpload() {
      const name = document.getElementById('t-name').value;
      const fileInput = document.getElementById('t-file').files[0];
      if (!name || !fileInput) return alert("Please provide a name and PDF file.");
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const b64 = e.target.result.split(',')[1];
        google.script.run.withSuccessHandler(res => {
          alert("Template created successfully!");
          fetchTemplates();
        }).saveTemplate(name, b64, fileInput.type, "[]");
      };
      reader.readAsDataURL(fileInput);
    }

    function openEditor(id) {
      state.selectedTemplate = state.templates.find(t => t.templateId === id);
      state.fields = state.selectedTemplate.fields || [];
      state.view = 'editor';
      render();
    }

    function addField(type) {
      state.fields.push({ type, x: 20, y: 20, w: 25, h: 6, value: '' });
      renderEditorFieldsOverlay();
    }

    function renderEditorFieldsOverlay() {
      const overlay = document.getElementById('field-overlay');
      overlay.innerHTML = state.fields.map((f, i) => `
        <div class="absolute border-2 border-dashed border-indigo-400 bg-indigo-500/20 rounded flex items-center justify-center text-xs font-semibold text-indigo-200"
             style="left: ${f.x}%; top: ${f.y}%; width: ${f.w}%; height: ${f.h}%;">
          ${f.type.toUpperCase()}
        </div>`).join('');
    }

    function sendEnvelope() {
      const name = document.getElementById('signer-name').value;
      const email = document.getElementById('signer-email').value;
      if (!name || !email) return alert("Enter signer details.");

      google.script.run.withSuccessHandler(res => {
        prompt("Envelope sent! Copy signing link:", res.signLink);
      }).createAndSendEnvelope(state.selectedTemplate.templateId, name, email);
    }

    // --- SIGNING SESSION LOGIC ---
    function loadSigningSession() {
      document.getElementById('nav-status').innerText = 'Signing Session';
      google.script.run.withSuccessHandler(session => {
        state.session = session;
        state.fields = session.fields;
        state.view = 'signing';
        render();
      }).withFailureHandler(err => {
        document.getElementById('main-content').innerHTML = `<div class="text-red-400 text-center py-20">${err.message}</div>`;
      }).getSigningSession(state.token);
    }

    async function renderSigningCanvas() {
      const pdfBytes = Uint8Array.from(atob(state.session.pdfBase64), c => c.charCodeAt(0));
      const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
      const page = await pdfDoc.getPage(1);
      
      const canvas = document.getElementById('pdf-canvas');
      const ctx = canvas.getContext('2d');
      const viewport = page.getViewport({ scale: 1.2 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      renderSigningFields(viewport.width, viewport.height);
    }

    function renderSigningFields(width, height) {
      const overlay = document.getElementById('signing-overlay');
      overlay.innerHTML = '';
      
      state.fields.forEach((f, idx) => {
        const el = document.createElement('div');
        el.className = 'absolute border-2 border-indigo-500 bg-indigo-500/20 rounded flex items-center justify-center text-xs font-semibold cursor-pointer';
        el.style.left = f.x + '%';
        el.style.top = f.y + '%';
        el.style.width = f.w + '%';
        el.style.height = f.h + '%';

        if (f.type === 'signature') {
          el.innerText = f.value ? 'Signed ✓' : 'Click to Sign';
          el.onclick = () => openSigModal(idx);
        } else if (f.type === 'date') {
          const input = document.createElement('input');
          input.type = 'date';
          input.className = 'w-full h-full bg-transparent text-center text-white text-xs border-0 outline-none';
          input.value = f.value || new Date().toISOString().split('T')[0];
          input.onchange = (e) => state.fields[idx].value = e.target.value;
          el.appendChild(input);
        } else if (f.type === 'text') {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Enter text';
          input.className = 'w-full h-full bg-transparent px-1 text-white text-xs border-0 outline-none';
          input.value = f.value || '';
          input.oninput = (e) => state.fields[idx].value = e.target.value;
          el.appendChild(input);
        } else if (f.type === 'checkbox') {
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = f.value === 'true';
          input.onchange = (e) => state.fields[idx].value = e.target.checked ? 'true' : 'false';
          el.appendChild(input);
        }
        overlay.appendChild(el);
      });
    }

    let currentSigFieldIndex = null;
    function openSigModal(idx) {
      currentSigFieldIndex = idx;
      document.getElementById('sig-modal').classList.remove('hidden');
      setupSigCanvasDrawing();
    }
    function closeSigModal() {
      document.getElementById('sig-modal').classList.add('hidden');
    }
    function clearSigCanvas() {
      const canvas = document.getElementById('sig-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    function setupSigCanvasDrawing() {
      const canvas = document.getElementById('sig-canvas');
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      let painting = false;
      
      canvas.onmousedown = (e) => { painting = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
      canvas.onmousemove = (e) => { if (!painting) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); };
      canvas.onmouseup = () => { painting = false; };
    }
    function saveSigCanvas() {
      const canvas = document.getElementById('sig-canvas');
      state.fields[currentSigFieldIndex].value = canvas.toDataURL('image/png');
      closeSigModal();
      renderSigningFields(canvas.width, canvas.height);
    }

    async function submitSigningSession() {
      const pdfBytes = Uint8Array.from(atob(state.session.pdfBase64), c => c.charCodeAt(0));
      const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
      const page = pdfDoc.getPage(0);
      const { width, height } = page.getSize();

      for (let f of state.fields) {
        const px = (f.x / 100) * width;
        const py = height - ((f.y + f.h) / 100) * height;
        const pw = (f.w / 100) * width;
        const ph = (f.h / 100) * height;

        if (f.type === 'signature' && f.value && f.value.startsWith('data:image')) {
          const pngImageBytes = Uint8Array.from(atob(f.value.split(',')[1]), c => c.charCodeAt(0));
          const pngImage = await pdfDoc.embedPng(pngImageBytes);
          page.drawImage(pngImage, { x: px, y: py, width: pw, height: ph });
        } else if (f.type === 'text' || f.type === 'date') {
          page.drawText(f.value || '', { x: px + 2, y: py + 4, size: 10 });
        } else if (f.type === 'checkbox' && f.value === 'true') {
          page.drawText('X', { x: px + 4, y: py + 2, size: 12 });
        }
      }

      const modifiedPdfBytes = await pdfDoc.save();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(modifiedPdfBytes)));

      google.script.run.withSuccessHandler(() => {
        document.getElementById('main-content').innerHTML = `
          <div class="text-center py-20">
            <h2 class="text-2xl font-bold text-emerald-400 mb-2">Document Signed Successfully!</h2>
            <p class="text-slate-400 text-sm">Thank you. You can now close this window.</p>
          </div>`;
      }).submitSignedDocument(state.token, b64, JSON.stringify(state.fields));
    }
  </script>
</body>
